name: Build and Deploy
on:
  push:
    branches:
      - main

env:
  REGISTRY: 10.10.0.150:5000
  REG: 10.10.0.150:5000/${{ secrets.REGISTRY_USER }}

jobs:
  build-and-deploy:
    runs-on: k3s-runner
    steps:
      - name: Checkout
        env:
          GIT_TOKEN: ${{ gitea.token }}
        run: |
          git clone http://x-access-token:$GIT_TOKEN@10.10.0.150:3000/${{ gitea.repository }}.git .
          git checkout ${{ gitea.sha }}

      - name: Debug
        run: |
          echo "REGISTRY=$REGISTRY"
          echo "REG=$REG"
          kubectl version --client

      - name: Login to Registry
        run: |
          echo "${{ secrets.REGISTRY_TOKEN }}" | docker login ${{ env.REGISTRY }} \
            -u "${{ secrets.REGISTRY_USER }}" --password-stdin

      - name: Build and Push Image
        run: |
          SHA=${{ gitea.sha }}

          # Build image pakai Dockerfile standar di root direktori
          DOCKER_BUILDKIT=0 docker build \
            -t $REG/portal-backend:$SHA \
            -t $REG/portal-backend:latest \
            .

          docker push $REG/portal-backend:$SHA
          docker push $REG/portal-backend:latest

      - name: Apply k8s Manifests
        env:
          KUBE_CONFIG_DATA: ${{ secrets.KUBECONFIG }}
        run: |
          mkdir -p ~/.kube
          echo "$KUBE_CONFIG_DATA" > ~/.kube/config
          chmod 600 ~/.kube/config

          SHA=${{ gitea.sha }}
          IMAGE=$REG/portal-backend:$SHA

          # Apply Namespace Portal
          kubectl apply -f k8s/namespace.yaml

          # Registry Credentials
          kubectl create secret docker-registry registry-credentials \
            --docker-server=$REGISTRY \
            --docker-username=${{ secrets.REGISTRY_USER }} \
            --docker-password=${{ secrets.REGISTRY_TOKEN }} \
            --namespace=portal \
            --dry-run=client -o yaml | kubectl apply -f -

          # 🚀 INJECT SEMUA SECRETS (DB, JWT, & MINIO) KE DALAM K8S
          kubectl create secret generic portal-secrets \
            --from-literal=DATABASE_URL="${{ secrets.DATABASE_URL }}" \
            --from-literal=DB_SCHEMA="${{ secrets.DB_SCHEMA }}" \
            --from-literal=JWT_SECRET="${{ secrets.JWT_SECRET }}" \
            --from-literal=PORT="3000" \
            --from-literal=MINIO_ENDPOINT="${{ secrets.MINIO_ENDPOINT }}" \
            --from-literal=MINIO_PORT="${{ secrets.MINIO_PORT }}" \
            --from-literal=MINIO_USE_SSL="${{ secrets.MINIO_USE_SSL }}" \
            --from-literal=MINIO_ACCESS_KEY="${{ secrets.MINIO_ACCESS_KEY }}" \
            --from-literal=MINIO_SECRET_KEY="${{ secrets.MINIO_SECRET_KEY }}" \
            --from-literal=MINIO_BUCKET_NAME="${{ secrets.MINIO_BUCKET_NAME }}" \
            --namespace=portal \
            --dry-run=client -o yaml | kubectl apply -f -

          # Apply Service, Ingress, & Deployment
          kubectl apply -f k8s/service.yaml
          kubectl apply -f k8s/ingress.yaml
          sed "s|IMAGE_PLACEHOLDER|$IMAGE|g" k8s/deployment.yaml | kubectl apply -f -

      - name: Wait for Rollout
        run: |
          kubectl rollout status deployment/portal-backend -n portal --timeout=120s

      - name: Show Pod status on failure
        if: failure()
        run: |
          kubectl -n portal get pods -o wide || true
          kubectl -n portal describe deployment/portal-backend || true
          kubectl -n portal logs deploy/portal-backend --tail=200 || true