services:
  - type: web
    name: portal-backend-api
    env: node
    # Build process: install dependencies, generate prisma client, build nestjs
    buildCommand: yarn install --frozen-lockfile && npx prisma generate && yarn build
    # Start process: apply migrations, seed data, run production build
    startCommand: npx prisma migrate deploy && yarn db:seed && yarn start:prod
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DB_SCHEMA
        value: portal
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: portal-db
          property: connectionString

databases:
  - name: portal-db
    databaseName: portaldb
    user: portaluser
    plan: free